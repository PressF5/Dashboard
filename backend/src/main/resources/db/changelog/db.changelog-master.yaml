databaseChangeLog:
  - changeSet:
      id: 001-create-analytics-snapshot
      author: dashboard
      changes:
        - sql:
            sql: |
              CREATE TABLE analytics_snapshot (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                report_date DATE NOT NULL,
                report_type VARCHAR(80) NOT NULL,
                page_slug VARCHAR(80) NOT NULL,
                page_path VARCHAR(255) NOT NULL DEFAULT '',
                payload JSONB NOT NULL,
                fetched_at TIMESTAMPTZ NOT NULL,
                CONSTRAINT uk_snapshot_day_comm_page UNIQUE (report_date, report_type, page_slug)
              );
              CREATE INDEX idx_snapshot_date ON analytics_snapshot(report_date);
              CREATE INDEX idx_snapshot_page_date ON analytics_snapshot(page_slug, report_date);
